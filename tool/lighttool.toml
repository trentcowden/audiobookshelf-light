[tool]
id = "com.trentcowden.audiobookshelf"
label = "Audiobookshelf"
versionCode = 1
versionName = "0.1.0"
permissions = ["android.permission.INTERNET"]
# detached-audio: playback continues (with media controls) after leaving the tool.
# cleartext-http: lets you point the tool at a plain-http server on your home network.
capabilities = ["detached-audio", "cleartext-http"]
orientation = "portrait"
# for the LightOS emulator, use the line below and build with -DlightSdk.allowAltServerPackage=true
# serverPackage = "com.thelightphone.sdk.emulator"
serverPackage = "com.lightos"
